name: Publish verified PC3001
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pc3001-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'RazerSEMUPH/razer-mu-pc-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load verified private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pc3001"
          cd "$RUNNER_TEMP/pc3001"
          python3 - <<'PY'
          import os,json,urllib.request,subprocess,hashlib,zipfile
          token=os.environ['GH_TOKEN']
          url='https://api.github.com/repos/RazerSEMUPH/razer-mu-pc-releases/releases/428335172'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'RazerMU-PC3001'})
          with urllib.request.urlopen(req,timeout=30) as r:release=json.load(r)
          assert release['draft'] and release['name']=='RAZER MU PC 2026103001 — Inventory, Party UI & Login Fix'
          assets={x['name']:x for x in release['assets']}
          chunks={'PC3001-transfer-00.bin': {'size': 5000000, 'sha256': '70dcb9e8955a6040ae6446aef08843ee979e149fc20cabb9f089789461d6dac6'}, 'PC3001-transfer-01.bin': {'size': 5000000, 'sha256': 'f539dbe0c53eb4aa684ad57f3687ec20d6b994ea1bafa3b613107e36ec869107'}, 'PC3001-transfer-02.bin': {'size': 5000000, 'sha256': '1400d833c9f10034649179188d78f2ae13753715113f56bb2f42f31e94e4def0'}, 'PC3001-transfer-03.bin': {'size': 5000000, 'sha256': 'd879445d0f677890a0bc6355461aa4655dc85de264be12f9390672278b720a6b'}, 'PC3001-transfer-04.bin': {'size': 5000000, 'sha256': 'ae94718b0f2a17d0082ac8cb1d5af2e4f956ff93a7f4ae387f9ab9b5a8508d88'}, 'PC3001-transfer-05.bin': {'size': 5000000, 'sha256': '084c346db2f11c2093b0207f0d75ae735b79aa46e86c4f93fe246a41145d5ffe'}, 'PC3001-transfer-06.bin': {'size': 5000000, 'sha256': '2a6e9e466ae6445a1a667d1aaf9f7a1e7cf6d375a1ca92e7e4842dd6bf038377'}, 'PC3001-transfer-07.bin': {'size': 4600539, 'sha256': '84361d59e60b09cb99ae21c532138f004bddd3410e2e08ee8cd3e8b0930ea34c'}}
          with open('transfer.zip','wb') as combined:
              for name,meta in chunks.items():
                  asset=assets[name]
                  assert asset['state']=='uploaded' and asset['size']==meta['size'] and asset['digest']=='sha256:'+meta['sha256']
                  cfg='header = "Authorization: Bearer '+token+'"\nheader = "Accept: application/octet-stream"\n'
                  subprocess.run(['curl','--fail','--silent','--show-error','--location','--max-time','180','--config','-','--output',name,asset['url']],input=cfg,text=True,check=True)
                  with open(name,'rb') as part:content=part.read()
                  assert hashlib.sha256(content).hexdigest()==meta['sha256']
                  combined.write(content)
          with open('transfer.zip','rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='81f551996b267402abb71c2ebb992e5909fdee95f0730cd9d8b00e56e0b88169'
          with zipfile.ZipFile('transfer.zip') as z:
              assert set(z.namelist())=={'transfer.json','payload.zip','publish.py'}
              z.extractall('.')
          print('Private transfer verified.')
          PY
      - name: Match the verified compression runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pc3001"
          curl --fail --silent --show-error --location --max-time 180 -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          echo 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  zlib.tar.gz' | sha256sum --check
          tar -xzf zlib.tar.gz
          cd zlib-1.3.2
          ./configure --prefix="$RUNNER_TEMP/pc3001/zlib-runtime"
          make -j2
          make install
      - name: Reconstruct, verify and publish the exact approved package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pc3001"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/pc3001/zlib-runtime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('publish.py');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='54c5821452d157ab46c375f6f3b6157d8eb2e31466c51ee57c8a23ed90855a5b'
          old="'--data-binary','@'+str(out/name)"
          new="'--upload-file',str(out/name)"
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace("  if q.returncode==0:", "  if q.returncode: print('Upload diagnostic:',name,q.returncode,q.stderr[:1500],flush=True)\n  if q.returncode==0:")
          p.write_text(s)
          PY
          python3 publish.py
