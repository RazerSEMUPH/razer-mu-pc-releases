name: Publish verified PC3102
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pc3102-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'RazerSEMUPH/razer-mu-pc-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load verified private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pc3102"
          cd "$RUNNER_TEMP/pc3102"
          python3 - <<'PY'
          import os,json,urllib.request,subprocess,hashlib,zipfile
          token=os.environ['GH_TOKEN']
          url='https://api.github.com/repos/RazerSEMUPH/razer-mu-pc-releases/releases?per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'RazerMU-PC3102'})
          with urllib.request.urlopen(req,timeout=30) as r:releases=json.load(r)
          matches=[r for r in releases if r['draft'] and r['name']=='RAZER MU PC 2026103102 — Party Support & Loot Recovery']
          assert len(matches)==1
          release=matches[0]
          assert release['draft'] and release['name']=='RAZER MU PC 2026103102 — Party Support & Loot Recovery'
          assets={x['name']:x for x in release['assets']}
          chunks={'PC3102-transfer-00.bin': {'size': 5000000, 'sha256': 'ec721b6d5707b4f89feaf4b24f6ce6506dda32e84822c59fc9d37454db19c009'}, 'PC3102-transfer-01.bin': {'size': 5000000, 'sha256': '1af97efb564adfa65fbcdd52b377ceb2aca22d87c41e612f07c5c073b58e80ed'}, 'PC3102-transfer-02.bin': {'size': 5000000, 'sha256': '8a9ee13169162d5819e6f024f0d836480b92aa5731f0842f0ae36ab8ed22d7e8'}, 'PC3102-transfer-03.bin': {'size': 5000000, 'sha256': '65e53744a89da90a75715e365d43c5970a3771b4aa3a264534d361532b19f527'}, 'PC3102-transfer-04.bin': {'size': 5000000, 'sha256': '233416a25dfca544680f709bb61a4e053907d8834ba2c3bdcd3ca53344b532c3'}, 'PC3102-transfer-05.bin': {'size': 5000000, 'sha256': '85254209ee3399a12e10db68853f4b0a1ed4e852f8cb32b85e74ce81f30c4e25'}, 'PC3102-transfer-06.bin': {'size': 450828, 'sha256': '8028b67d7f6c9910df661b2dbb485c5aae9f576e6ba2948793600b772c622ba1'}}
          with open('transfer.zip','wb') as combined:
              for name,meta in chunks.items():
                  asset=assets[name]
                  assert asset['state']=='uploaded' and asset['size']==meta['size'] and asset['digest']=='sha256:'+meta['sha256']
                  cfg='header = "Authorization: Bearer '+token+'"\nheader = "Accept: application/octet-stream"\n'
                  subprocess.run(['curl','--fail','--silent','--show-error','--location','--max-time','180','--config','-','--output',name,asset['url']],input=cfg,text=True,check=True)
                  with open(name,'rb') as part:content=part.read()
                  assert hashlib.sha256(content).hexdigest()==meta['sha256']
                  combined.write(content)
          with open('transfer.zip','rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='e2f071d35f314f52f7a993f687f6d6fbaf3509bc8e0c42fab7240d2d4278b40d'
          with zipfile.ZipFile('transfer.zip') as z:
              assert set(z.namelist())=={'transfer.json','payload.zip','publish.py'}
              z.extractall('.')
          print('Private transfer verified.')
          PY
      - name: Reconstruct, verify and publish the exact approved package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pc3102"
          python3 publish.py
