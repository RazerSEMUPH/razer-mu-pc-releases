name: Publish verified PC1101
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pc1101-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'RazerSEMUPH/razer-mu-pc-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load verified private transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pc1101"
          cd "$RUNNER_TEMP/pc1101"
          python3 - <<'PY'
          import os,json,urllib.request,subprocess,hashlib,zipfile
          token=os.environ['GH_TOKEN']
          url='https://api.github.com/repos/RazerSEMUPH/razer-mu-pc-releases/releases?per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'RazerMU-PC1101'})
          with urllib.request.urlopen(req,timeout=30) as r:releases=json.load(r)
          matches=[r for r in releases if r['draft'] and r['name']=='RAZER MU PC 2026110101 — Movement Recovery & Viewport Safety']
          assert len(matches)==1
          release=matches[0]
          assert release['draft'] and release['name']=='RAZER MU PC 2026110101 — Movement Recovery & Viewport Safety'
          assets={x['name']:x for x in release['assets']}
          chunks={'PC1101-transfer-00.bin': {'size': 5000000, 'sha256': 'f4d7bd13b04a70d2852eda18b2ce9fdff4d24000261e62bb9a2a9e1466a3c344'}, 'PC1101-transfer-01.bin': {'size': 5000000, 'sha256': 'aec3cec80cda70f706519edc26c3d5c80e9f377b021438367aa2864b8e6a8545'}, 'PC1101-transfer-02.bin': {'size': 5000000, 'sha256': '44f4bddbad9728b973932c033a857fdddd988a1eaef16a9a32e0988e244cfb35'}, 'PC1101-transfer-03.bin': {'size': 5000000, 'sha256': 'fbf434ffa3476a00820e933687ee75c8aae6c2bf3c95b2db5b17fd8ceee2979a'}, 'PC1101-transfer-04.bin': {'size': 5000000, 'sha256': '901e4f4e5be2b9a690d7ab386f024ac5f7201aca39f012036137e09e512276e0'}, 'PC1101-transfer-05.bin': {'size': 5000000, 'sha256': '5ca0ac25b458ce1830bd62344653acf191969a68f40294ccd1a5b5f3e2873950'}, 'PC1101-transfer-06.bin': {'size': 451193, 'sha256': 'f61d5eb4093aed721a66cdd485024804b70103403df78415b93813af37650d7b'}}
          with open('transfer.zip','wb') as combined:
              for name,meta in chunks.items():
                  asset=assets[name]
                  assert asset['state']=='uploaded' and asset['size']==meta['size'] and asset['digest']=='sha256:'+meta['sha256']
                  cfg='header = "Authorization: Bearer '+token+'"\nheader = "Accept: application/octet-stream"\n'
                  subprocess.run(['curl','--fail','--silent','--show-error','--location','--max-time','180','--config','-','--output',name,asset['url']],input=cfg,text=True,check=True)
                  with open(name,'rb') as part:content=part.read()
                  assert hashlib.sha256(content).hexdigest()==meta['sha256']
                  combined.write(content)
          with open('transfer.zip','rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='ce1d74883d1030192cd00bbe0187b39cd91a71ad83c42638e36896325b26b303'
          with zipfile.ZipFile('transfer.zip') as z:
              assert set(z.namelist())=={'transfer.json','payload.zip','publish.py'}
              z.extractall('.')
          print('Private transfer verified.')
          PY
      - name: Reconstruct, verify and publish the exact approved package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pc1101"
          python3 publish.py
